<!DOCTYPE html>
<html lang="id" data-theme="samudra" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Upload Aja</title>
<script>
// Terapkan tema sebelum halaman tampil (hindari kedip)
(function(){try{
  var T=["samudra","zamrud","anggur","senja","grafit"],t=localStorage.getItem("theme"),m=localStorage.getItem("mode")||"auto",r=document.documentElement;
  if(T.indexOf(t)>-1)r.dataset.theme=t;
  r.dataset.mode=(m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light";
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cloud" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
</svg>

<header class="top">
  <div>
    <h1 class="brand"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-cloud"/></svg></span>Upload Aja</h1>
    <nav class="nav">
      <button class="btn ghost" id="themeBtn" type="button" aria-label="Ubah tema"><svg class="i" aria-hidden="true"><use href="#i-drop"/></svg><span class="lbl">Tema</span></button>
      <button class="btn ghost" id="adminBtn" type="button" aria-label="Admin"><svg class="i" aria-hidden="true"><use href="#i-shield"/></svg><span class="lbl">Admin</span><span class="dot"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="compose" id="compose" aria-label="Upload">
    <form id="form">
      <input class="field" id="name" type="text" maxlength="60" placeholder="Nama (boleh kosong)" autocomplete="name" aria-label="Nama">
      <textarea class="field" id="text" rows="3" placeholder="Tulis catatan (opsional)" aria-label="Pesan"></textarea>

      <label class="drop" id="drop">
        <span class="ic"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg></span>
        <b id="dropT">Pilih atau seret file</b>
        <span class="sub" id="dropS">File Maksimal 25MB</span>
        <input id="file" type="file" multiple>
      </label>

      <div class="chipsum" id="chipsum" hidden><span id="sumT"></span><button type="button" id="clearAll">Kosongkan semua</button></div>
      <div class="chips" id="chips" hidden></div>

      <div class="opt">
        <fieldset class="seg">
          <legend>Simpan selama</legend>
          <div class="opts">
            <label><input type="radio" name="ttl" value="1"><span>1 hari</span></label>
            <label><input type="radio" name="ttl" value="7" checked><span>7 hari</span></label>
            <label class="lk"><input type="radio" name="ttl" value="30" disabled><span><svg class="i sm lkic" aria-hidden="true"><use href="#i-lock"/></svg>30 hari</span></label>
            <label class="lk"><input type="radio" name="ttl" value="0" disabled><span><svg class="i sm lkic" aria-hidden="true"><use href="#i-lock"/></svg>Selamanya</span></label>
          </div>
        </fieldset>
        <div class="hint" id="lockHint"><svg class="i sm" aria-hidden="true"><use href="#i-lock"/></svg>Khusus admin</div>
        <label class="switch off" id="onceBox">
          <span class="sl"><svg class="i sm" aria-hidden="true"><use href="#i-lock"/></svg>Hapus setelah diunduh sekali</span>
          <input type="checkbox" id="once" disabled>
          <span class="track"></span>
        </label>
      </div>

      <progress id="bar" max="100" value="0" hidden></progress>
      <div class="upst" id="upst" hidden></div>
      <button class="btn primary" id="send" type="submit"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span id="sendlbl">Upload</span></button>
    </form>
  </section>

  <section class="feed" aria-label="Kiriman">
    <nav class="fbarW" id="folderBar" aria-label="Folder" hidden></nav>
    <div class="feedhead">
      <h2>Kiriman terbaru<small id="count"></small></h2>
      <button class="btn ghost icon" id="refresh" type="button" aria-label="Muat ulang"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="ftools">
      <input class="field" id="fq" type="search" placeholder="Cari nama, catatan, atau nama file" aria-label="Cari kiriman">
      <select class="field" id="ff" aria-label="Filter kiriman">
        <option value="all">Semua</option><option value="files">Ada file</option><option value="text">Hanya teks</option><option value="once">Sekali unduh</option><option value="forever">Tanpa batas</option>
      </select>
    </div>
    <div class="bulk" id="bulk" hidden>
      <label class="chk"><input type="checkbox" id="selAll"><span>Pilih semua yang tampil</span></label>
      <span class="sp"></span>
      <span class="when" id="selN"></span>
      <button class="btn danger" id="bulkDel" type="button" disabled><svg class="i sm" aria-hidden="true"><use href="#i-trash"/></svg>Hapus terpilih</button>
    </div>
    <div class="list" id="list"></div>
    <button class="btn ghost" id="more" type="button" hidden>Muat lebih banyak</button>
  </section>
</main>

<dialog id="tdlg" aria-labelledby="ttitle">
  <div class="dh"><span id="ttitle">Tampilan</span><button class="btn ghost icon" type="button" id="tclose" aria-label="Tutup"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <div><span class="l">Warna tema</span><div class="themes" id="themes"></div></div>
    <div><span class="l">Mode</span>
      <div class="modes" id="modes">
        <button type="button" data-mode="light" aria-pressed="false"><svg class="i sm" aria-hidden="true"><use href="#i-sun"/></svg>Terang</button>
        <button type="button" data-mode="dark" aria-pressed="false"><svg class="i sm" aria-hidden="true"><use href="#i-moon"/></svg>Gelap</button>
        <button type="button" data-mode="auto" aria-pressed="false"><svg class="i sm" aria-hidden="true"><use href="#i-monitor"/></svg>Otomatis</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="dh"><span id="dtitle">Admin</span><button class="btn ghost icon" type="button" id="dclose" aria-label="Tutup"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <div id="loginRow" class="rowf">
      <input class="field" id="key" type="password" placeholder="Kunci admin" autocomplete="current-password" aria-label="Kunci admin">
      <button class="btn primary" style="width:auto;height:40px;box-shadow:none" id="login" type="button">Masuk</button>
    </div>
    <div id="tools" hidden>
      <section class="sec">
        <h3>Statistik</h3>
        <div class="stats" id="stats" hidden></div>
        <button class="btn" id="statBtn" type="button">Hitung statistik</button>
        <div class="msg" id="sstatus" role="status" aria-live="polite"></div>
      </section>
      <section class="sec">
        <h3>Folder</h3>
        <button class="btn" id="fopen" type="button"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>Kelola folder</button>
      </section>
      <section class="sec">
        <h3>Hapus file lama</h3>
        <div>
          <label class="l" for="cdays">Hapus file yang lebih lama dari</label>
          <select class="field" id="cdays"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option></select>
        </div>
        <label class="chk"><input type="checkbox" id="callmsg"><span>Hapus juga teks pesannya<small>Jika tidak dicentang, teks tetap ada dan hanya file yang dihapus.</small></span></label>
        <button class="btn danger" id="cleanup" type="button"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Hapus file lama</button>
        <div class="msg" id="cstatus" role="status" aria-live="polite"></div>
      </section>
      <section class="sec">
        <h3>Perawatan</h3>
        <button class="btn" id="orph" type="button"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Pindai file yatim</button>
        <button class="btn danger" id="wipe" type="button"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Hapus semua kiriman</button>
        <div class="msg" id="ostatus" role="status" aria-live="polite"></div>
      </section>
      <button class="btn ghost" id="logout" type="button">Keluar dari admin</button>
    </div>
    <div class="msg" id="astatus" role="status" aria-live="polite"></div>
  </div>
</dialog>
<dialog id="edlg" aria-labelledby="edtitle">
  <div class="dh"><span id="edtitle">Ubah masa simpan</span><button class="btn ghost icon" type="button" id="edclose" aria-label="Tutup"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <div class="msg" id="edinfo"></div>
    <div>
      <label class="l" for="edays">Simpan lagi selama (dihitung dari sekarang)</label>
      <select class="field" id="edays"><option value="1">1 hari</option><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option><option value="365">365 hari</option><option value="0">Selamanya</option></select>
    </div>
    <button class="btn primary" id="edsave" type="button">Simpan</button>
    <div class="msg" id="edstatus" role="status" aria-live="polite"></div>
  </div>
</dialog>
<dialog id="fdlg" aria-labelledby="fdtitle">
  <div class="dh"><span id="fdtitle">Folder</span><button class="btn ghost icon" type="button" id="fdclose" aria-label="Tutup"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <div class="crumbs" id="fcrumbs"></div>
    <div class="ftool"><button class="btn" id="fnew" type="button">Folder baru</button><button class="btn" id="fall" type="button">Pilih semua</button><button class="btn primary" id="fmv" type="button" style="box-shadow:none" disabled>Pindahkan terpilih</button></div>
    <div class="fl2" id="fsubs"></div>
    <div class="fl2" id="ffiles"></div>
    <button class="btn" id="fmore" type="button" hidden>Muat lagi</button>
    <div class="msg" id="fstatus" role="status" aria-live="polite"></div>
  </div>
</dialog>
<dialog id="mdlg" aria-labelledby="mtitle">
  <div class="dh"><span id="mtitle">Pindahkan</span><button class="btn ghost icon" type="button" id="mclose" aria-label="Tutup"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="db">
    <div class="msg" id="minfo"></div>
    <div><label class="l" for="msel">Folder tujuan</label><select class="field" id="msel"></select></div>
    <button class="btn primary" id="mok" type="button">Pindahkan</button>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
